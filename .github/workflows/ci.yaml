name: deploy-eks.

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write lets the job request a short-lived OIDC token from GitHub.
# AWS exchanges it for temporary credentials. No access keys are stored anywhere.
permissions:
  id-token: write
  contents: read

# Never cancel a deploy halfway: queue instead.
concurrency:
  group: deploy-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: gist-classic         # change
  ECR_REPOSITORY: gist-api
  K8S_NAMESPACE: default
  # AWS_ROLE_ARN is a repository *variable* (Settings > Secrets and variables > Actions > Variables).
  # A role ARN is an identifier, not a secret.

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest responses
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume the CI role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image name (tag = commit SHA)
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build (loaded locally, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REVISION=${{ github.sha }}

      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push (skip if this SHA is already in ECR, so re-runs work with immutable tags)
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image $GITHUB_SHA already in ECR, skipping push"
          else
            docker push "${{ steps.meta.outputs.image }}"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Optional approval gate: add required reviewers to the "production" environment in GitHub.
    environment: production
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I? (shows the assumed role in the logs)
        run: aws sts get-caller-identity

      - name: Point kubectl at the cluster
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Deploy
        run: |
          sed "s|gist-api:ci|$IMAGE|" k8s/deployment.yaml | kubectl -n "$K8S_NAMESPACE" apply -f -
          kubectl -n "$K8S_NAMESPACE" rollout status deploy/gist-api --timeout=180s

      - name: Roll back if the rollout failed
        if: failure()
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout undo deploy/gist-api || true
          kubectl -n "$K8S_NAMESPACE" get pods -o wide
          kubectl -n "$K8S_NAMESPACE" describe deploy/gist-api | tail -30
          kubectl -n "$K8S_NAMESPACE" logs -l app=gist-api --tail=50 --all-containers || true
