name: cicd

# test (cloud) -> build + push to GHCR (cloud) -> deploy to local kind (your self-hosted runner)
# The deploy job pulls the exact image CI pushed, loads it into kind, and rolls it out.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest responses
      - run: pytest -q

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # lets GITHUB_TOKEN push to GHCR
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase) with the commit SHA as tag
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REVISION=${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: [self-hosted, windows]
    permissions:
      contents: read
      packages: read             # lets GITHUB_TOKEN pull from GHCR
    defaults:
      run:
        shell: pwsh
    env:
      IMAGE: ${{ needs.build-push.outputs.image }}
      KIND_CLUSTER: gist
      NAMESPACE: default
    steps:
      - uses: actions/checkout@v4

      - name: Pull the image from GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:GHCR_TOKEN | docker login ghcr.io -u $env:GITHUB_ACTOR --password-stdin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker pull $env:IMAGE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Load into kind (nodes cannot see your local Docker images otherwise)
        run: |
          kind load docker-image $env:IMAGE --name $env:KIND_CLUSTER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy and wait for rollout
        run: |
          $ctx = "kind-$($env:KIND_CLUSTER)"
          (Get-Content k8s/deployment.yaml) -replace 'gist-api:ci', $env:IMAGE |
            kubectl --context $ctx -n $env:NAMESPACE apply -f -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl --context $ctx -n $env:NAMESPACE rollout status deploy/gist-api --timeout=120s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Roll back and show diagnostics on failure
        if: failure()
        run: |
          $ctx = "kind-$($env:KIND_CLUSTER)"
          kubectl --context $ctx -n $env:NAMESPACE rollout undo deploy/gist-api
          kubectl --context $ctx -n $env:NAMESPACE get pods -o wide
          kubectl --context $ctx -n $env:NAMESPACE logs -l app=gist-api --tail=50 --all-containers
          exit 0

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io